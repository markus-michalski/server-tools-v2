name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ShellCheck & Format
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Install shfmt
        run: |
          SHFMT_VERSION="v3.10.0"
          curl -sSLo /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt

      - name: Run ShellCheck
        run: shellcheck -x bin/server-tools lib/*.sh lib/webserver/*.sh

      - name: Check formatting
        run: shfmt -i 4 -bn -ci -d bin/server-tools lib/*.sh lib/webserver/*.sh

  test:
    runs-on: ubuntu-latest
    name: BATS Tests
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Setup test dependencies
        run: make setup-tests

      - name: Run tests
        run: bats tests/unit/*.bats

  install-smoke-test:
    runs-on: ubuntu-latest
    name: Install Smoke Test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow clone) so install_tools'
          # `git describe --tags` resolves a real tag instead of falling
          # back to a bare commit hash.
          fetch-depth: 0

      # Exercises both documented install entry points end to end against
      # the real system paths they ship against -- this is what would have
      # caught lib/webserver/ going missing from `make install` for 3+ weeks
      # (#21) and is the install-path regression guard requested in #23.

      - name: make install, then run the installed binary
        run: |
          sudo make install
          # The binary is mode 700 (root-only, by design -- see lib/install.sh)
          # so it's always invoked via sudo, exactly as README.md documents.
          sudo /usr/local/bin/server-tools --version
          sudo /usr/local/bin/st --version
          sudo /usr/local/bin/servertools --version
          test -f /usr/local/lib/server-tools/webserver/apache.sh
          test -f /usr/local/lib/server-tools/webserver/nginx.sh
          # Regression guard: a swallowed `git describe` failure (e.g. the
          # "dubious ownership" check tripping because install runs as root
          # in a checkout owned by the actions runner user) must not pass
          # unnoticed as a silent "dev" version.
          ! sudo /usr/local/bin/server-tools --version | grep -qx "server-tools dev"

      - name: make uninstall, then verify nothing is left behind
        run: |
          sudo make uninstall
          test ! -e /usr/local/bin/server-tools
          test ! -e /usr/local/bin/st
          test ! -e /usr/local/bin/servertools
          test ! -e /usr/local/lib/server-tools

      - name: sudo ./bin/server-tools install (the documented path), then verify
        run: |
          sudo ./bin/server-tools install
          sudo /usr/local/bin/server-tools --version
          sudo /usr/local/bin/st --version
          sudo /usr/local/bin/servertools --version
          test -f /usr/local/lib/server-tools/webserver/apache.sh
          test -f /usr/local/lib/server-tools/webserver/nginx.sh
          ! sudo /usr/local/bin/server-tools --version | grep -qx "server-tools dev"

      - name: sudo ./bin/server-tools uninstall, then verify nothing is left behind
        run: |
          sudo ./bin/server-tools uninstall
          test ! -e /usr/local/bin/server-tools
          test ! -e /usr/local/bin/st
          test ! -e /usr/local/bin/servertools
          test ! -e /usr/local/lib/server-tools
